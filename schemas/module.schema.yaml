# Module Schema Definition
# Modules are reusable workflow patterns composed of multiple atoms

$schema: "http://json-schema.org/draft-07/schema#"
$id: "https://customer-journey-as-code.org/schemas/module.schema.yaml"

title: Customer Journey Module
description: A reusable workflow pattern composed of multiple atoms (similar to NASA DIDs)

type: object
required:
  - id
  - name
  - description
  - atoms
  - owner_role
  - version

properties:
  # === IDENTITY ===
  id:
    type: string
    pattern: "^module-[a-z0-9-]+$"
    description: "Unique module identifier"
    examples:
      - "module-pre-qualification"
      - "module-income-verification"
      - "module-appraisal"

  name:
    type: string
    minLength: 5
    maxLength: 100
    description: "Human-readable module name"

  description:
    type: string
    minLength: 20
    maxLength: 1000
    description: "Detailed description of module purpose and workflow"

  # === COMPOSITION ===
  atoms:
    type: array
    minItems: 2
    items:
      type: string
      pattern: "^atom-[a-z]+-\\d{2,3}-[a-z0-9-]+$"
    description: "List of atom IDs in this module (order matters)"

  sub_modules:
    type: array
    items:
      type: string
      pattern: "^module-[a-z0-9-]+$"
    description: "Optional nested modules"

  # === OWNERSHIP ===
  owner_role:
    type: string
    enum:
      - "loan_officer"
      - "processor"
      - "underwriter"
      - "closer"
      - "operations_manager"
      - "compliance_officer"
    description: "Primary role responsible for this module"

  supporting_roles:
    type: array
    items:
      type: string
    description: "Additional roles involved"

  # === TIMING ===
  target_hours:
    type: number
    minimum: 0
    description: "Target completion time in business hours"

  max_hours:
    type: number
    minimum: 0
    description: "Maximum acceptable completion time"

  typical_duration_days:
    type: integer
    minimum: 0
    description: "Typical calendar days to complete"

  # === MILESTONES ===
  customer_milestone:
    type: string
    description: "Customer-visible milestone achieved"
    examples:
      - "Pre-Approved"
      - "Income Verified"
      - "Appraisal Complete"
      - "Clear to Close"

  internal_milestone:
    type: string
    description: "Internal process milestone"

  # === SUCCESS CRITERIA ===
  success_criteria:
    type: array
    minItems: 1
    items:
      type: string
    description: "Conditions that must be met for successful completion"

  completion_checklist:
    type: array
    items:
      type: object
      required:
        - item
        - required
      properties:
        item:
          type: string
        required:
          type: boolean
        notes:
          type: string

  # === FAILURE MODES ===
  failure_modes:
    type: array
    items:
      type: object
      required:
        - failure
        - mitigation
      properties:
        failure:
          type: string
          description: "Potential failure scenario"
        probability:
          type: string
          enum: ["low", "medium", "high"]
        impact:
          type: string
          enum: ["low", "medium", "high"]
        mitigation:
          type: string
          description: "How to prevent or handle this failure"

  # === DEPENDENCIES ===
  dependencies:
    type: object
    properties:
      requires_modules:
        type: array
        items:
          type: string
          pattern: "^module-[a-z0-9-]+$"
        description: "Modules that must complete first"

      enables_modules:
        type: array
        items:
          type: string
          pattern: "^module-[a-z0-9-]+$"
        description: "Modules this unlocks"

      parallel_modules:
        type: array
        items:
          type: string
          pattern: "^module-[a-z0-9-]+$"
        description: "Modules that can run concurrently"

  # === DATA ===
  inputs:
    type: array
    items:
      type: object
      required:
        - data_point
        - source
      properties:
        data_point:
          type: string
        source:
          type: string
        required:
          type: boolean
        format:
          type: string

  outputs:
    type: array
    items:
      type: object
      required:
        - data_point
        - destination
      properties:
        data_point:
          type: string
        destination:
          type: string
        format:
          type: string

  # === REGULATORY ===
  regulatory_requirements:
    type: array
    items:
      type: object
      required:
        - regulation
        - requirement
      properties:
        regulation:
          type: string
          enum:
            - "TRID"
            - "RESPA"
            - "ECOA"
            - "FCRA"
            - "HMDA"
            - "FHA"
            - "VA"
            - "USDA"
            - "Fannie Mae"
            - "Freddie Mac"
        requirement:
          type: string
        deadline:
          type: string
        section:
          type: string

  # === METRICS ===
  performance_metrics:
    type: object
    properties:
      completion_rate_percent:
        type: number
        minimum: 0
        maximum: 100

      average_duration_hours:
        type: number
        minimum: 0

      rework_rate_percent:
        type: number
        minimum: 0
        maximum: 100

      customer_satisfaction_score:
        type: number
        minimum: 1
        maximum: 10

      nps_impact:
        type: integer
        minimum: -100
        maximum: 100

  # === VARIANTS ===
  variants:
    type: array
    items:
      type: object
      required:
        - variant_name
        - differences
      properties:
        variant_name:
          type: string
          description: "Variant identifier (e.g., 'FHA', 'VA', 'Self-Employed')"

        differences:
          type: string
          description: "How this variant differs"

        additional_atoms:
          type: array
          items:
            type: string
            pattern: "^atom-[a-z]+-\\d{2,3}-[a-z0-9-]+$"
          description: "Additional atoms required"

        removed_atoms:
          type: array
          items:
            type: string
            pattern: "^atom-[a-z]+-\\d{2,3}-[a-z0-9-]+$"
          description: "Atoms not needed in this variant"

        modified_timing:
          type: object
          properties:
            target_hours:
              type: number
            max_hours:
              type: number

  # === AUTOMATION ===
  automation:
    type: object
    properties:
      automation_level:
        type: string
        enum: ["manual", "semi_automated", "fully_automated"]

      automated_atoms:
        type: array
        items:
          type: string
          pattern: "^atom-[a-z]+-\\d{2,3}-[a-z0-9-]+$"
        description: "Which atoms are automated"

      manual_touchpoints:
        type: array
        items:
          type: string
        description: "Where human intervention is required"

      automation_opportunities:
        type: array
        items:
          type: object
          properties:
            opportunity:
              type: string
            estimated_savings_hours:
              type: number
            complexity:
              type: string
              enum: ["low", "medium", "high"]

  # === QUALITY ASSURANCE ===
  quality_checks:
    type: array
    items:
      type: object
      required:
        - checkpoint
        - criteria
      properties:
        checkpoint:
          type: string
          description: "What to check"
        criteria:
          type: string
          description: "Pass/fail criteria"
        frequency:
          type: string
          enum: ["every_instance", "sample", "exception_only"]
        responsible_role:
          type: string

  # === TRAINING ===
  training_requirements:
    type: object
    properties:
      required_training:
        type: array
        items:
          type: string
        description: "Training courses required"

      estimated_training_hours:
        type: number

      competency_checks:
        type: array
        items:
          type: string

  # === SOP LINKS ===
  sop_links:
    type: array
    items:
      type: object
      required:
        - sop_id
      properties:
        sop_id:
          type: string
          pattern: "^sop-[a-z]{2,4}-\\d{3}-[a-z0-9-]+$"
        relevance:
          type: string
          enum: ["primary", "supporting", "reference"]
        section:
          type: string
        notes:
          type: string

  # === VERSIONING ===
  version:
    type: string
    pattern: "^\\d+\\.\\d+\\.\\d+$"
    description: "Semantic version"

  last_updated:
    type: string
    format: date-time

  change_log:
    type: array
    items:
      type: object
      required:
        - version
        - date
        - description
      properties:
        version:
          type: string
        date:
          type: string
          format: date-time
        author:
          type: string
        description:
          type: string
        impact:
          type: string
          enum: ["minor", "moderate", "major"]

  # === METADATA ===
  tags:
    type: array
    items:
      type: string

  notes:
    type: string

  related_modules:
    type: array
    items:
      type: string
      pattern: "^module-[a-z0-9-]+$"
    description: "Modules often used together"
